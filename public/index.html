<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invoice Vision — Import & Generate QR</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
          --brand:#1f4e78; --brand2:#2563eb; --ok:#16a34a; --okbg:#ecfdf5; --err:#dc2626; --errbg:#fef2f2; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:18px 24px; }
  header h1 { margin:0; font-size:18px; } header p { margin:4px 0 0; opacity:.85; font-size:12px; }
  main { max-width:1040px; margin:20px auto; padding:0 16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card h2 { margin:0 0 12px; font-size:15px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button, .btn { border:1px solid var(--line); background:#fff; color:var(--ink); padding:9px 14px; border-radius:8px;
          font-weight:600; cursor:pointer; font-size:13px; }
  button.primary { background:var(--brand2); color:#fff; border-color:var(--brand2); }
  button.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .muted { color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:7px 9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { background:#f9fafb; position:sticky; top:0; }
  .scroll { max-height:46vh; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .b-ok { background:var(--okbg); color:var(--ok); } .b-err { background:var(--errbg); color:var(--err); }
  .b-pending { background:#eff6ff; color:var(--brand2); }
  .alert { padding:10px 12px; border-radius:8px; font-size:13px; }
  .alert.ok { background:var(--okbg); color:#065f46; } .alert.err { background:var(--errbg); color:#991b1b; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  ul.errs { margin:4px 0 0; padding-left:16px; color:var(--err); font-size:12px; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
  .qr { border:1px solid var(--line); border-radius:8px; padding:8px; text-align:center; background:#fff; }
  .qr img { width:100%; aspect-ratio:1; object-fit:contain; image-rendering:pixelated; background:#fff; }
  .qr .cap { font-size:11px; margin-top:6px; word-break:break-all; }
  .bar { height:8px; background:var(--line); border-radius:999px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); width:0; transition:width .3s; }
  input[type=file]{ display:none; }
</style>
</head>
<body>
<header>
  <h1>Invoice Vision</h1>
  <p>Import Excel invoice → generate QR massal lewat aplikasi VISION Invoice Digital Transformation</p>
</header>

<main>
  <section class="card">
    <h2>1. Siapkan & upload file</h2>
    <div class="row">
      <button id="btnTemplate">⬇ Download Template</button>
      <label class="btn" for="file">📄 Pilih File Excel</label>
      <input id="file" type="file" accept=".xlsx" />
      <span id="fname" class="muted"></span>
    </div>
    <div id="previewMsg" style="margin-top:12px"></div>
    <div id="previewWrap" style="margin-top:12px"></div>
    <div class="row" id="importRow" style="margin-top:12px; display:none">
      <button id="btnImport" class="primary">✓ Simpan sebagai Job</button>
    </div>
  </section>

  <section class="card" id="jobCard" style="display:none">
    <h2>2. Generate QR</h2>
    <div id="jobMsg"></div>
    <div class="row" style="margin:10px 0">
      <button id="btnGenerate" class="ok">▶ Generate Semua QR</button>
      <button id="btnRefresh">⟳ Refresh</button>
      <button id="btnZip">⬇ Download Semua (ZIP)</button>
      <span id="genState" class="muted"></span>
    </div>
    <div class="bar"><i id="progFill"></i></div>
    <p id="progText" class="muted" style="margin:6px 0 0"></p>
    <div class="scroll" style="margin-top:12px">
      <table>
        <thead><tr><th>#</th><th>SUPP_INV_NO</th><th class="num">Before Tax</th><th class="num">Total</th>
          <th class="num">Tax</th><th>Tax No</th><th>QR</th></tr></thead>
        <tbody id="jobBody"></tbody>
      </table>
    </div>
  </section>

  <section class="card" id="galleryCard" style="display:none">
    <h2>3. Hasil QR</h2>
    <div id="gallery" class="gallery"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let file = null, pollTimer = null;

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).message||r.statusText); return r.json(); }

$("#btnTemplate").onclick = () => location.href = "/api/template";

$("#file").onchange = async (e) => {
  file = e.target.files[0]; if(!file) return;
  $("#fname").textContent = file.name;
  $("#previewMsg").innerHTML = '<span class="muted">Membaca file…</span>';
  $("#previewWrap").innerHTML = ""; $("#importRow").style.display = "none";
  const fd = new FormData(); fd.append("file", file);
  try {
    const r = await fetch("/api/preview", { method:"POST", body:fd });
    const data = await r.json();
    if(!r.ok) throw new Error(data.message);
    renderPreview(data);
  } catch(err){ $("#previewMsg").innerHTML = `<div class="alert err">${err.message}</div>`; }
};

function num(v){ const n=Number(v); return isNaN(n)? v : n.toLocaleString("id-ID"); }

function renderPreview(data){
  const s = data.summary;
  $("#previewMsg").innerHTML = data.valid
    ? `<div class="alert ok">${s.total} baris siap. Klik "Simpan sebagai Job" untuk lanjut.</div>`
    : `<div class="alert err">${s.invalid} dari ${s.total} baris error. Perbaiki file lalu pilih ulang.</div>`;
  const rows = data.rows.map(r => `
    <tr style="${r.errors.length?'background:#fef2f2':''}">
      <td>${r.baris}</td>
      <td>${r.errors.length? '<span class="badge b-err">Error</span>' : '<span class="badge b-ok">OK</span>'}</td>
      <td>${esc(r.suppInvNo)}</td>
      <td class="num">${num(r.amountBeforeTax)}</td>
      <td class="num">${num(r.totalInvoiceAmount)}</td>
      <td class="num">${num(r.invTaxAmount)}</td>
      <td>${esc(r.invTaxNo)}
        ${r.errors.length? `<ul class="errs">${r.errors.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`:''}</td>
    </tr>`).join("");
  $("#previewWrap").innerHTML = `<div class="scroll"><table>
    <thead><tr><th>Baris</th><th>Cek</th><th>SUPP_INV_NO</th><th class="num">Before Tax</th>
      <th class="num">Total</th><th class="num">Tax</th><th>INV_TAX_NO</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  $("#importRow").style.display = data.valid ? "flex" : "none";
}

$("#btnImport").onclick = async () => {
  if(!file) return;
  const fd = new FormData(); fd.append("file", file);
  const r = await fetch("/api/import", { method:"POST", body:fd });
  const data = await r.json();
  if(!r.ok){ $("#previewMsg").innerHTML = `<div class="alert err">${data.message}</div>`; return; }
  $("#jobCard").style.display = "block";
  await refresh();
  $("#jobCard").scrollIntoView({ behavior:"smooth" });
};

$("#btnGenerate").onclick = async () => {
  const r = await fetch("/api/generate", { method:"POST" });
  const data = await r.json();
  if(!r.ok){ $("#jobMsg").innerHTML = `<div class="alert err">${data.message}</div>`; return; }
  $("#jobMsg").innerHTML = `<div class="alert ok">${data.message}</div>`;
  startPolling();
};
$("#btnRefresh").onclick = refresh;
$("#btnZip").onclick = () => location.href = "/api/download-zip";

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function refresh(){
  const st = await jget("/api/status");
  if(!st.job) return;
  $("#jobCard").style.display = "block";
  $("#genState").textContent = st.generating ? "⏳ sedang generate…" : "";
  const done = st.done, total = st.total;
  $("#progFill").style.width = total? (done/total*100)+"%" : "0";
  $("#progText").textContent = `${done} / ${total} QR selesai`;
  $("#jobBody").innerHTML = st.job.rows.map(r => `
    <tr><td>${r.no}</td><td>${esc(r.suppInvNo)}</td>
      <td class="num">${num(r.amountBeforeTax)}</td><td class="num">${num(r.totalInvoiceAmount)}</td>
      <td class="num">${num(r.invTaxAmount)}</td><td>${esc(r.invTaxNo)}</td>
      <td>${r.hasQr? '<span class="badge b-ok">✓ ada</span>' : '<span class="badge b-pending">pending</span>'}</td>
    </tr>`).join("");
  const withQr = st.job.rows.filter(r=>r.hasQr);
  $("#galleryCard").style.display = withQr.length? "block":"none";
  $("#gallery").innerHTML = withQr.map(r => `
    <div class="qr"><img src="/api/qr/${encodeURIComponent(r.file)}?t=${Date.now()}" alt="${esc(r.suppInvNo)}" />
      <div class="cap">${esc(r.suppInvNo)}</div></div>`).join("");
  if(!st.generating && pollTimer){ clearInterval(pollTimer); pollTimer=null; }
}

function startPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer = setInterval(refresh, 1500); refresh(); }

refresh().catch(()=>{});
</script>
</body>
</html>
