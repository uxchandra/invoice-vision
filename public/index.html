<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invoice Vision — Import & Generate QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#f4efe6; --paper:#ffffff; --soft:#faf7f1; --line:#e5dccb;
    --ink:#2a2620; --muted:#6b6357;
    --brand:#1f4e79; --brand-dark:#163a5c; --brand-soft:#e6eef6;
    --ok:#2e7d4f; --ok-dark:#246640; --okbg:#e9f5ee; --okline:#bfe0cb;
    --err:#c0392b; --errbg:#fbecea; --errline:#f0c6c0;
    --radius:16px;
    --shadow:0 1px 2px rgba(60,45,20,.05), 0 8px 24px rgba(60,45,20,.07);
    --font:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
    --mono:"Cascadia Code",Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; font:18px/1.6 var(--font); color:var(--ink); background:var(--bg); overflow-x:clip; }
  a { color:inherit; }

  /* ---------- Header ---------- */
  header { position:sticky; top:0; z-index:50; background:rgba(244,239,230,.92); backdrop-filter:blur(8px);
           border-bottom:1px solid var(--line); }
  .head-inner { max-width:1180px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:14px; }
  .head-inner img { height:44px; width:auto; }
  .brand { font-weight:800; font-size:21px; letter-spacing:-.3px; }
  .head-tag { margin-left:auto; font-size:14px; font-weight:600; color:var(--brand);
              background:var(--brand-soft); padding:7px 14px; border-radius:999px; }

  /* ---------- Buttons ---------- */
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  button, .btn { display:inline-flex; align-items:center; gap:10px; font:700 17px/1 var(--font);
          text-decoration:none; padding:16px 24px; min-height:56px; border-radius:12px;
          background:var(--paper); color:var(--ink); border:1.5px solid var(--line);
          cursor:pointer; transition:background .15s, border-color .15s, transform .1s, box-shadow .15s; }
  button:hover, .btn:hover { border-color:#cfc3ad; background:var(--soft); }
  button:active, .btn:active { transform:translateY(1px); }
  button:focus-visible, .btn:focus-visible { outline:3px solid var(--brand); outline-offset:3px; }
  button.primary, .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff;
          box-shadow:0 4px 14px rgba(31,78,121,.25); }
  button.primary:hover, .btn.primary:hover { background:var(--brand-dark); border-color:var(--brand-dark); }
  button.ok { background:var(--ok); border-color:var(--ok); color:#fff; box-shadow:0 4px 14px rgba(46,125,79,.25); }
  button.ok:hover { background:var(--ok-dark); border-color:var(--ok-dark); }
  button:disabled { opacity:.5; cursor:not-allowed; transform:none; }
  .muted { color:var(--muted); }
  #fname { font-weight:600; color:var(--brand); }

  /* ---------- Step cards ---------- */
  main { max-width:1180px; margin:40px auto; padding:0 24px; display:grid; grid-template-columns:minmax(0,1fr); gap:28px; }
  main > * { min-width:0; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:32px; }
  .card-head { display:flex; align-items:center; gap:16px; margin:0 0 6px; }
  .step-no { flex:none; width:48px; height:48px; border-radius:50%; background:var(--brand); color:#fff;
             font-weight:800; font-size:22px; display:grid; place-items:center; }
  .card h2 { margin:0; font-size:clamp(24px,2.6vw,30px); font-weight:800; letter-spacing:-.5px; }
  .hint { margin:0 0 24px 64px; font-size:17.5px; color:var(--muted); max-width:760px; }

  /* ---------- Mode tabs & form manual ---------- */
  .card-head:has(.tabs) { flex-wrap:wrap; margin-bottom:10px; }
  .tabs { display:inline-flex; gap:4px; padding:5px; margin-left:auto; background:#f3ecdf; border-radius:14px; }
  .tab { min-height:50px; padding:12px 22px; border:0; border-radius:10px; background:transparent; color:var(--muted); box-shadow:none; }
  .tab:hover { background:rgba(255,255,255,.55); }
  .tab.active { background:var(--paper); color:var(--brand); box-shadow:0 1px 4px rgba(60,45,20,.12); }
  [hidden] { display:none !important; }
  .form-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; max-width:780px; margin:0 0 24px; }
  .field { display:grid; grid-template-columns:260px minmax(0,1fr); align-items:center; gap:6px 20px; }
  .field label { display:block; font-weight:700; font-size:15px; letter-spacing:.2px; }
  @media (max-width:700px) { .field { grid-template-columns:minmax(0,1fr); } }
  .field label small { display:block; font-size:15px; font-weight:500; color:var(--muted); letter-spacing:0; }
  .inp { width:100%; font:600 18px var(--font); color:var(--ink); padding:14px 16px; background:var(--soft);
         border:1.5px solid var(--line); border-radius:12px; transition:border-color .15s, box-shadow .15s; }
  .inp::placeholder { color:#b3a994; font-weight:500; }
  .inp:focus { outline:0; border-color:var(--brand); background:var(--paper); box-shadow:0 0 0 4px var(--brand-soft); }
  .inp.money { text-align:right; font-variant-numeric:tabular-nums; }
  .btn-del { min-height:40px; padding:8px 14px; font-size:14.5px; color:var(--err); border-color:var(--errline); box-shadow:none; }
  .btn-del:hover { background:var(--errbg); border-color:var(--err); }

  /* ---------- Tables ---------- */
  .scroll { max-height:56vh; overflow-y:auto; overflow-x:hidden; border:1px solid var(--line); border-radius:12px; background:var(--paper); }
  table { width:100%; border-collapse:collapse; font-size:15.5px; }
  th,td { padding:12px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th:first-child, td:first-child { padding-left:16px; }
  th:last-child, td:last-child { padding-right:16px; }
  thead th { background:#f3ecdf; color:var(--muted); font-weight:700; font-size:12px; letter-spacing:.3px; line-height:1.35;
             position:sticky; top:0; z-index:1; }
  td { white-space:nowrap; }
  td:has(.errs), td:has(.link) { white-space:normal; }
  .link { overflow-wrap:anywhere; }
  tbody tr:hover { background:var(--soft); }
  tbody tr:last-child td { border-bottom:0; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .mono { font-family:var(--mono); font-size:14.5px; }

  .badge { white-space:nowrap; display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px;
           font-weight:700; font-size:14px; border:1px solid transparent; }
  .b-ok { background:var(--okbg); color:var(--ok); border-color:var(--okline); }
  .b-err { background:var(--errbg); color:var(--err); border-color:var(--errline); }
  .b-pending { background:var(--brand-soft); color:var(--brand); }

  .alert { padding:16px 20px; border-radius:12px; border:1px solid transparent; font-size:17.5px; font-weight:600; }
  .alert.ok { background:var(--okbg); color:#1e5a37; border-color:var(--okline); }
  .alert.err { background:var(--errbg); color:#8a2318; border-color:var(--errline); }

  ul.errs { margin:6px 0 0; padding-left:18px; color:var(--err); font-weight:600; font-size:14.5px; white-space:normal; }

  .bar { height:16px; background:#ece4d5; border-radius:999px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; border-radius:999px; transition:width .35s;
             background:linear-gradient(90deg,var(--ok),#43a36b); }
  #progText { font-weight:700; font-size:18px; }
  #genState, #resultState { font-weight:600; font-size:16px; color:var(--brand); }

  .qr-thumb { width:84px; height:84px; object-fit:contain; background:#fff; border:1px solid var(--line); border-radius:10px;
              padding:5px; image-rendering:pixelated; display:block; transition:transform .15s, box-shadow .15s; }
  .qr-thumb:hover { transform:scale(1.06); box-shadow:var(--shadow); }
  .qr-cell { width:100px; }
  .link { color:var(--brand); font-weight:700; font-size:15px; text-underline-offset:3px; }
  input[type=file]{ display:none; }

  footer { position:fixed; left:0; right:0; bottom:0; z-index:50; background:rgba(244,239,230,.92); backdrop-filter:blur(8px);
           border-top:1px solid var(--line); }
  body { padding-bottom:64px; }
  .foot { max-width:1180px; margin:0 auto; padding:14px 24px; font-size:14.5px; color:var(--muted);
          display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }

  /* Layar sempit: tiap baris tabel jadi kartu bertumpuk */
  @media (max-width:1024px) {
    .scroll { max-height:none; border:0; border-radius:0; overflow:visible; }
    table, tbody, tr, td { display:block; width:100%; }
    thead { display:none; }
    tbody tr { border:1px solid var(--line); border-radius:12px; padding:6px 16px; margin-bottom:14px; background:var(--paper); }
    tbody tr:last-child td { border-bottom:1px dashed var(--line); }
    td, td:first-child, td:last-child { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:10px 0;
         border-bottom:1px dashed var(--line); text-align:right; white-space:normal; overflow-wrap:anywhere; }
    tbody tr td:last-child { border-bottom:0; }
    td::before { content:attr(data-label); flex:none; max-width:45%; text-align:left; font-size:13px; font-weight:700; color:var(--muted); }
    td > * { min-width:0; }
  }
  @media (max-width:600px) {
    body { font-size:17px; }
    .head-inner, main, .foot { padding-left:16px; padding-right:16px; }
    .head-tag, .foot span:last-child { display:none; }
    .card { padding:22px 18px; }
    .hint, .tabs { margin-left:0; }
    .tabs { display:flex; width:100%; }
    .tab { flex:1; padding:12px 10px; }
    .step-no { width:42px; height:42px; font-size:19px; }
    button, .btn { width:100%; justify-content:center; }
  }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <img src="/images/logo.png" alt="STEP" />
    <span class="brand">Invoice Vision</span>
    <span class="head-tag">QR Invoice</span>
  </div>
</header>

<main>
  <section class="card">
    <div class="card-head">
      <span class="step-no">1</span><h2>Siapkan &amp; Upload File</h2>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="upload" role="tab">&#128196; Upload Excel</button>
        <button type="button" class="tab" data-mode="manual" role="tab">&#9998; Input Manual</button>
      </div>
    </div>

    <div id="modeUpload">
      <div class="row">
        <button id="btnTemplate">&darr; Download Template</button>
        <label class="btn primary" for="file">Pilih File Excel</label>
        <input id="file" type="file" accept=".xlsx" />
        <span id="fname" class="muted"></span>
      </div>
    </div>

    <div id="modeManual" hidden>
      <form id="manualForm" class="form-grid" autocomplete="off">
        <div class="field">
          <label for="fSupp">SUPP_INV_NO </label>
          <input class="inp" id="fSupp" name="suppInvNo"/>
        </div>
        <div class="field">
          <label for="fDpp">AMOUNT_BEFORE_TAX </label>
          <input class="inp money" id="fDpp" name="amountBeforeTax" inputmode="decimal"  />
        </div>
        <div class="field">
          <label for="fTotal">TOTAL_INVOICE_AMOUNT</label>
          <input class="inp money" id="fTotal" name="totalInvoiceAmount" inputmode="decimal"  />
        </div>
        <div class="field">
          <label for="fPpn">INV_TAX_AMOUNT </label>
          <input class="inp money" id="fPpn" name="invTaxAmount" inputmode="decimal"  />
        </div>
        <div class="field">
          <label for="fTaxNo">INV_TAX_NO </label>
          <input class="inp" id="fTaxNo" name="invTaxNo" inputmode="numeric"  />
        </div>
      </form>
      <div class="row">
        <button type="submit" form="manualForm" class="primary">&#65291; Tambah ke Daftar</button>
        <button type="button" id="btnClearForm">Kosongkan Isian</button>
      </div>
    </div>
    <div id="previewMsg" style="margin-top:24px"></div>
    <div id="previewWrap" style="margin-top:18px"></div>
    <div class="row" id="importRow" style="margin-top:24px; display:none">
      <button id="btnImport" class="ok">&#9654; Generate QR</button>
      <span id="genState"></span>
    </div>
    <div id="progWrap" style="margin-top:24px; display:none">
      <div class="bar"><i id="progFill"></i></div>
      <p id="progText" style="margin:12px 0 0"></p>
    </div>
  </section>

  <section class="card" id="galleryCard" style="display:none">
    <div class="card-head"><span class="step-no">2</span><h2>Hasil QR</h2></div>
    <div class="row" style="margin-bottom:24px">
      <button id="btnExcel" class="primary">&darr; Export Excel</button>
      <span id="resultState"></span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>#</th><th>SUPP_<wbr>INV_<wbr>NO</th><th class="num">AMOUNT_<wbr>BEFORE_<wbr>TAX</th>
          <th class="num">TOTAL_<wbr>INVOICE_<wbr>AMOUNT</th><th class="num">INV_<wbr>TAX_<wbr>AMOUNT</th>
          <th>INV_<wbr>TAX_<wbr>NO</th><th class="qr-cell">QR</th><th>FILE</th></tr></thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </section>
</main>

<footer><div class="foot"><span>STEP · Invoice Vision</span><span>Import → QR → Selesai</span></div></footer>

<script>
const $ = (s) => document.querySelector(s);
let file = null, pollTimer = null;

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error((await r.json().catch(()=>({}))).message||r.statusText); return r.json(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function num(v){ const n=Number(v); return isNaN(n)? esc(v) : n.toLocaleString("id-ID"); }

$("#btnTemplate").onclick = () => location.href = "/api/template";

$("#file").onchange = async (e) => {
  file = e.target.files[0]; if(!file) return;
  $("#fname").textContent = file.name;
  $("#previewMsg").innerHTML = '<span class="muted">Membaca file…</span>';
  $("#previewWrap").innerHTML = ""; $("#importRow").style.display = "none";
  $("#previewMsg").scrollIntoView({ behavior:"smooth", block:"center" });
  const fd = new FormData(); fd.append("file", file);
  try {
    const r = await fetch("/api/preview", { method:"POST", body:fd });
    const data = await r.json();
    if(!r.ok) throw new Error(data.message);
    renderPreview(data);
  } catch(err){ $("#previewMsg").innerHTML = `<div class="alert err">${esc(err.message)}</div>`; }
};

function renderPreview(data, manual=false){
  const s = data.summary;
  // Daftar error per invoice ditampilkan di kotak pesan (bukan kolom tabel)
  const errList = data.rows.filter(r => r.errors.length).map(r =>
    `<li><b>${r.suppInvNo? esc(r.suppInvNo) : (manual? `Invoice ke-${r.baris}` : `Baris ${r.baris}`)}</b>: ${r.errors.map(esc).join("; ")}</li>`).join("");
  $("#previewMsg").innerHTML = data.valid
    ? `<div class="alert ok">✓ ${s.total} ${manual?'invoice':'baris'} siap. Klik "Generate QR" untuk membuat QR.</div>`
    : `<div class="alert err">✕ ${s.invalid} dari ${s.total} ${manual?'invoice error. Hapus lalu isi ulang.':'baris error. Perbaiki file lalu pilih ulang.'}
        <ul class="errs">${errList}</ul></div>`;
  const rows = data.rows.map((r, i) => `
    <tr style="${r.errors.length?'background:var(--errbg)':''}">
      ${fieldCells(r)}
      ${manual? `<td data-label="Aksi"><button type="button" class="btn-del" data-del="${i}">Hapus</button></td>` : ''}
    </tr>`).join("");
  $("#previewWrap").innerHTML = `<div class="scroll"><table>
    <thead><tr><th>SUPP_<wbr>INV_<wbr>NO</th><th class="num">AMOUNT_<wbr>BEFORE_<wbr>TAX</th>
      <th class="num">TOTAL_<wbr>INVOICE_<wbr>AMOUNT</th><th class="num">INV_<wbr>TAX_<wbr>AMOUNT</th><th>INV_<wbr>TAX_<wbr>NO</th>${manual?'<th></th>':''}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  $("#importRow").style.display = data.valid ? "flex" : "none";
}

// ---------- Mode: Upload Excel / Input Manual ----------
let mode = "upload", manualList = [];

function clearPreview(){
  $("#previewMsg").innerHTML = ""; $("#previewWrap").innerHTML = "";
  $("#importRow").style.display = "none"; $("#progWrap").style.display = "none";
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  mode = t.dataset.mode;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
  $("#modeUpload").hidden = mode !== "upload";
  $("#modeManual").hidden = mode !== "manual";
  clearPreview();
  if(mode === "manual"){
    if(manualList.length) previewManual(manualList).then(d => renderPreview(d, true)).catch(()=>{});
    $("#fSupp").focus();
  }
  else if(file) $("#file").dispatchEvent(new Event("change"));
});

// Angka tampil 1.234.567,89 — dikirim ke server sebagai 1234567.89
const toRaw = (s) => s.replace(/\./g, "").replace(",", ".");
function fmtMoney(s){
  s = s.replace(/[^\d,]/g, "");
  const [int, ...dec] = s.split(",");
  const grouped = int.replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return dec.length ? `${grouped},${dec.join("").slice(0,2)}` : grouped;
}
document.querySelectorAll(".money").forEach(el => el.oninput = () => { el.value = fmtMoney(el.value); });

function formValues(){
  return {
    suppInvNo: $("#fSupp").value.trim(),
    invTaxNo: $("#fTaxNo").value.trim(),
    amountBeforeTax: toRaw($("#fDpp").value),
    invTaxAmount: toRaw($("#fPpn").value),
    totalInvoiceAmount: toRaw($("#fTotal").value),
  };
}

async function previewManual(list){
  const r = await fetch("/api/preview-manual", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ rows:list }) });
  const data = await r.json();
  if(!r.ok) throw new Error(data.message);
  return data;
}

$("#manualForm").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const candidate = [...manualList, formValues()];
    const data = await previewManual(candidate);
    const added = data.rows[data.rows.length - 1];
    if(added.errors.length){
      $("#previewMsg").innerHTML = `<div class="alert err">Data belum bisa ditambahkan:<ul class="errs">${added.errors.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
      return;
    }
    manualList = candidate;
    renderPreview(data, true);
    $("#manualForm").reset(); $("#fSupp").focus();
  } catch(err){ $("#previewMsg").innerHTML = `<div class="alert err">${esc(err.message)}</div>`; }
};
$("#btnClearForm").onclick = () => { $("#manualForm").reset(); $("#fSupp").focus(); };

$("#previewWrap").onclick = async (e) => {
  const del = e.target.closest("[data-del]"); if(!del) return;
  manualList.splice(Number(del.dataset.del), 1);
  if(!manualList.length){ clearPreview(); return; }
  try { renderPreview(await previewManual(manualList), true); }
  catch(err){ $("#previewMsg").innerHTML = `<div class="alert err">${esc(err.message)}</div>`; }
};

$("#btnImport").onclick = async () => {
  if(mode === "upload" ? !file : !manualList.length) return;
  const btn = $("#btnImport"); btn.disabled = true;
  try {
    let r;
    if(mode === "manual"){
      r = await fetch("/api/import-manual", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ rows:manualList }) });
    } else {
      const fd = new FormData(); fd.append("file", file);
      r = await fetch("/api/import", { method:"POST", body:fd });
    }
    let data = await r.json();
    if(!r.ok) throw new Error(data.message);
    r = await fetch("/api/generate", { method:"POST" });
    data = await r.json();
    if(!r.ok) throw new Error(data.message);
    $("#previewMsg").innerHTML = `<div class="alert ok">${esc(data.message)}</div>`;
    $("#progWrap").style.display = "block";
    startPolling();
  } catch(err){
    $("#previewMsg").innerHTML = `<div class="alert err">${esc(err.message)}</div>`;
  } finally { btn.disabled = false; }
};
$("#btnExcel").onclick = () => location.href = "/api/export-excel";

function fieldCells(r){
  return `<td class="mono" data-label="SUPP_INV_NO">${esc(r.suppInvNo)}</td>
    <td class="num" data-label="AMOUNT_BEFORE_TAX">${num(r.amountBeforeTax)}</td>
    <td class="num" data-label="TOTAL_INVOICE_AMOUNT">${num(r.totalInvoiceAmount)}</td>
    <td class="num" data-label="INV_TAX_AMOUNT">${num(r.invTaxAmount)}</td>
    <td class="mono" data-label="INV_TAX_NO">${esc(r.invTaxNo)}</td>`;
}

async function refresh(){
  const st = await jget("/api/status");
  if(!st.job) return;
  $("#genState").textContent = st.generating ? "⏳ Sedang membuat QR…" : "";
  const done = st.done, total = st.total;
  if(st.generating) $("#progWrap").style.display = "block";
  $("#progFill").style.width = total? (done/total*100)+"%" : "0";
  $("#progText").textContent = `${done} / ${total} QR selesai`;

  const withQr = st.job.rows.filter(r=>r.hasQr);
  $("#galleryCard").style.display = withQr.length? "block":"none";
  $("#resultState").textContent = withQr.length? `${withQr.length} QR siap diunduh` : "";
  $("#resultBody").innerHTML = withQr.map(r => {
    const url = `/api/qr/${encodeURIComponent(r.file)}?t=${Date.now()}`;
    return `<tr><td class="muted" data-label="#">${r.no}</td>${fieldCells(r)}
      <td data-label="QR"><a href="${url}" target="_blank"><img class="qr-thumb" src="${url}" alt="QR ${esc(r.suppInvNo)}" /></a></td>
      <td data-label="File"><a class="link" href="${url}" download="${esc(r.file)}">${esc(r.file)}</a></td></tr>`;
  }).join("");

  if(!st.generating && pollTimer){ clearInterval(pollTimer); pollTimer=null; }
}

function startPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer = setInterval(refresh, 1500); refresh(); }
</script>
</body>
</html>
